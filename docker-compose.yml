services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: fm, POSTGRES_PASSWORD: fm, POSTGRES_DB: fm }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U fm"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  mailhog:
    image: mailhog/mailhog
    ports: ["8025:8025"]
  api:
    build: ./backend
    env_file: [.env]
    environment: { DATABASE_URL: "postgresql+asyncpg://fm:fm@postgres:5432/fm", REDIS_URL: "redis://redis:6379/0", SMTP_HOST: mailhog }
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker -l info
    env_file: [.env]
    environment: { DATABASE_URL: "postgresql+asyncpg://fm:fm@postgres:5432/fm", REDIS_URL: "redis://redis:6379/0", SMTP_HOST: mailhog }
    depends_on: [api]
  beat:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app beat -l info
    env_file: [.env]
    environment: { REDIS_URL: "redis://redis:6379/0" }
    depends_on: [redis]
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    environment: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
