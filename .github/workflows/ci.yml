name: CI
on:
  push: { branches: [main, "claude/**"] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  migrations-postgres:
    # Unit tests run on SQLite for speed; this proves the migrations on the real database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: fm, POSTGRES_PASSWORD: fm, POSTGRES_DB: fm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fm:fm@localhost:5432/fm
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic check          # models and migrations agree
      - run: alembic downgrade base && alembic upgrade head   # every migration is reversible
      - run: python -m app.seed     # demo data loads on Postgres too

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm -w web run lint
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm -w mobile run typecheck
      - run: npm -w mobile test

  e2e:
    # Real browser against the real API: smoke flows + axe WCAG AA scan in light and dark themes.
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: pip install -e "backend[dev]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env: { CI: "true", E2E_PYTHON: python }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: web/test-results }
